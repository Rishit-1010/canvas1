<body>

<header id="topbar">
  <button id="sidebarBtn" title="Switch between Whiteboard and Graph" aria-label="Open menu"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="a" x="3.5" y="4.5" width="6" height="15" rx="2"/><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg></button>
  <h1 id="title"><span>Whiteboard</span></h1>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <textarea id="ted" spellcheck="false" wrap="off"></textarea>
  <div id="selbar" hidden>
    <button id="selColor" title="Colour"><span></span></button>
    <button id="selDup" title="Duplicate (Ctrl+D)" aria-label="Duplicate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
    <button id="selDel" title="Delete (Del)" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
  </div>
</div>

<div id="pop" hidden></div>
<div id="cp" hidden aria-label="Colour picker"></div>
<div id="hint" hidden></div>

<footer id="bbar">
  <nav id="tools" aria-label="Tools">
    <button class="tool" data-tool="select"   title="Select (V)"   aria-label="Select"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="a" d="M5 3l14 7.2-6 1.9-2 6.3z" transform="translate(1.5 1.5)"/><path d="M5 3l14 7.2-6 1.9-2 6.3z"/></svg><span class="tl">Select</span></button>
    <button class="tool" data-tool="move"     title="Move canvas (H)" aria-label="Move"><img class="rn" src="assets/icons/move.png" alt=""><img class="rw" src="assets/icons/move-w.png" alt=""><span class="tl">Move</span></button>
    <button class="tool active" data-tool="pen"      title="Pen (P)"      aria-label="Pen"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="a" d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19z" transform="translate(1.5 1.5)"/><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19zM14 7l3 3"/></svg><span class="tl">Pen</span></button>
    <button class="tool" data-tool="eraser"   title="Eraser (E)"   aria-label="Eraser"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="a" x="5.5" y="10.5" width="15" height="7.5" rx="2" transform="rotate(-45 13 14)"/><rect x="4" y="9" width="15" height="7.5" rx="2" transform="rotate(-45 11.5 12.7)"/><path d="M8.5 19.5H20"/></svg><span class="tl">Eraser</span></button>
    <button class="tool" data-tool="shapes"   title="Shapes (S)"   aria-label="Shapes"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="a" cx="18" cy="8.2" r="3.8"/><path d="M7 3.5l4 7H3z"/><circle cx="16.5" cy="7" r="3.8"/><rect x="7" y="13.5" width="8" height="7" rx="1.6"/></svg><span class="tl">Shapes</span></button>
    <button class="tool" data-tool="tools"    title="Geometry tools" aria-label="Tools"><img class="rn" src="assets/icons/tools.png" alt=""><img class="rw" src="assets/icons/tools-w.png" alt=""><span class="tl">Tools</span></button>
    <button class="tool" data-action="clear"  title="Clear board"  aria-label="Clear"><img class="rn" src="assets/icons/clear.png" alt=""><img class="rw" src="assets/icons/clear-w.png" alt=""><span class="tl">Clear</span></button>
    <button class="tool" data-tool="text"     title="Text (T)"     aria-label="Text"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="a" cx="17.3" cy="17.3" r="3.6"/><path d="M5 6.5V4.5h14v2M12 4.5v15M9 19.5h6"/></svg><span class="tl">Text</span></button>
    <button class="tool" data-action="backdrop" title="Backdrop"   aria-label="Backdrop"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="a" d="M3.5 4.5h17v15h-17z" transform="translate(1.4 1.4)"/><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.7"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg><span class="tl">Backdrop</span></button>
  </nav>
  <div id="ctrl">
    <div class="cg" id="g1"><button class="bb" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 8h6a4.5 4.5 0 010 9H8M9 4.5L5.5 8 9 11.5"/></svg></button><button class="bb" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8H9a4.5 4.5 0 000 9h7M15 4.5L18.5 8 15 11.5"/></svg></button></div>
    <div class="cg" id="g2"><button class="bb" id="prevBtn" title="Previous board" aria-label="Previous board"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5l-7 7 7 7"/></svg></button><span class="lbl txt" id="boardWord">Board</span><input id="pageNum" class="bb" type="text" inputmode="numeric" value="1" aria-label="Board number"><span class="lbl txt" id="pageOf">of 1</span><button class="bb" id="nextBtn" title="Next board" aria-label="Next board"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5l7 7-7 7"/></svg></button><button class="bb flat" id="addBtn" title="Add board" aria-label="Add board"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="bb flat" id="delBtn" title="Delete this board" aria-label="Delete board"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l.8 12h8.4L17 7M10.5 11v5M13.5 11v5"/></svg></button></div>
    <div class="cg" id="g3"><button class="bb flat" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8 11h6"/></svg></button><input id="zoomRange" type="range" min="0" max="1000" value="380" aria-label="Zoom" title="Zoom (click the icons or Ctrl + scroll)"><button class="bb flat" id="zoomInBtn" title="Zoom in" aria-label="Zoom in"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8 11h6M11 8v6"/></svg></button><button id="zoomPct" title="Reset zoom to 100%" aria-label="Reset zoom">100%</button></div>
  </div>
</footer>
