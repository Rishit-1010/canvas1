<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
iframe.on{visibility:visible}
</style>
</head>
<body>
<iframe id="v-board" title="Whiteboard" src="board.html" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<iframe id="v-graph" title="Graph Calculator" allow="fullscreen" data-src="graph.html"></iframe>
<script>
(function(){
  var fr={board:document.getElementById('v-board'),graph:document.getElementById('v-graph')},cur='';
  var T={board:"Whiteboard – Rishit's Canvas",graph:"Graph Calculator – Rishit's Canvas"};
  function load(v){var f=fr[v];if(!f.getAttribute('src'))f.src=f.dataset.src}
  function show(v,push){
    if(!fr[v])v='board';load(v);cur=v;
    for(var k in fr)fr[k].classList.toggle('on',k===v);
    document.title=T[v];
    if(push!==false){try{history.replaceState(null,'',v==='graph'?'#graph':location.pathname+location.search)}catch(e){}}
    try{fr[v].contentWindow.focus()}catch(e){}
  }
  addEventListener('message',function(e){if(e.data&&e.data.canvasView)show(e.data.canvasView)});
  addEventListener('hashchange',function(){show(location.hash==='#graph'?'graph':'board',false)});
  show(location.hash==='#graph'?'graph':'board',false);
  // warm up the other view so the first switch is instant
  var warm=function(){load(cur==='graph'?'board':'graph')};
  if(document.readyState==='complete')setTimeout(warm,300);else addEventListener('load',function(){setTimeout(warm,300)});
  if('serviceWorker' in navigator&&window.isSecureContext){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
